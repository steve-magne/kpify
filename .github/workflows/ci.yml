name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false  # stdlib only, nothing to cache
      - run: uv run --no-project python tests/test_check_run.py
      - run: uv run --no-project python tests/test_profile.py
      - name: Oracle drift
        run: uv run --no-project python examples/northwind-coffee/oracle.py && git diff --exit-code examples/northwind-coffee/expected
      - name: Plugin manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.251 plugin validate .
